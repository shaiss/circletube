# upstream.conf — forger's own lineage record (the inverted derives.conf):
# the machine's parent, print-bench. Contract and procedures:
# docs/upstream.md. House key: value format, print-bench's conf convention.
#
# This records the BOOTSTRAP hop (print-bench -> forger): print-bench is
# forger's MVP and forger is being extracted from it. That direction is
# temporary and reverses (PM.md decision log) — the enduring architecture
# is forger -> domain -> project (D10), and print-bench will be refactored
# onto forger as its 3d-printing domain. The CHILD hops (forger -> domain,
# domain/project -> forger) are recorded on the EMBEDDING side, not here:
# each embedder keeps its own equivalent record (which forger SHA it embeds,
# what it tuned). Those records and any backflow are F4-deferred to
# project #1, circletube (PM.md D9/D10); the format will mirror this file.
#
# forger is private only through bootstrap, then public (F5, renegotiated
# 2026-08-22 — no longer about secrecy). print-bench carries no back-pointer,
# by construction (a matter of not polluting the upstream repo).

upstream: https://github.com/shaiss/print-bench
synced-sha: 14c9a1923c756fea6713bd05dc6029c073d2aeea
synced-date: 2026-08-22

# adopted: platform files forger has taken from upstream, one per line,
# as `adopted: <upstream path> -> <forger path>`. None yet — the founding
# commit is docs only; forger adopts the PATTERN (see docs/factory-map.md),
# and file-level adoption starts with the first machinery.

# divergence: deliberate departures from an adopted upstream file, one per
# line, as `divergence: <forger path> | <why>`. Each is a claim the next
# sync pass re-checks. None yet.
