# Circletube — long-lived Node process (WebSocket `/ws` + ResponseScheduler).
# Railpack is Railway's default builder (Nixpacks is legacy). No Dockerfile.
# New Railway services do NOT apply this file — set build/start/healthcheck/restart
# in the service dashboard (see docs/deploy-railway.md). Existing Config-as-Code
# services keep using it until 2026-12-01. nixpacks.toml applies only if Nixpacks
# is selected in the dashboard.

[build]
buildCommand = "npm run build"

[deploy]
startCommand = "npm start"
healthcheckPath = "/api/health"
restartPolicyType = "ON_FAILURE"
