# Circletube — long-lived Node process (WebSocket `/ws` + ResponseScheduler).
# Railpack is Railway's default builder (Nixpacks is legacy). No Dockerfile.
# This file sets build/start/healthcheck only — it does not pin a builder.
# nixpacks.toml applies only if a service is switched to Nixpacks in the dashboard.

[build]
buildCommand = "npm run build"

[deploy]
startCommand = "npm start"
healthcheckPath = "/api/health"
restartPolicyType = "ON_FAILURE"
